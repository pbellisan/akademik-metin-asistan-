<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akademik Metin Asistanı & Analizör</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        
        .academic-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .loading-shimmer {
            background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .playing-bar {
            width: 4px;
            background: #4f46e5;
            animation: audio-pulse 1s ease-in-out infinite;
        }
        @keyframes audio-pulse {
            0%, 100% { height: 4px; }
            50% { height: 16px; }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-900">

    <div class="max-w-6xl mx-auto px-4 py-8">
        <!-- Header -->
        <header class="mb-10 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
                <h1 class="text-3xl font-extrabold text-indigo-900 tracking-tight">Akademik Metin Asistanı</h1>
                <p class="text-slate-500 mt-1">Makale analizi, eleştirel özet ve profesyonel seslendirme.</p>
            </div>
            <div class="flex items-center gap-2 bg-white p-2 rounded-2xl shadow-sm border border-slate-200 cursor-pointer hover:bg-slate-50 transition-colors" onclick="resetApiKey()" title="API Anahtarını Sıfırla">
                <span class="w-3 h-3 bg-green-500 rounded-full animate-pulse" id="api-status-dot"></span>
                <span class="text-xs font-semibold text-slate-600 uppercase tracking-wider" id="api-status-text">API Bağlı Değil</span>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <!-- Left Side: Input & Settings (5 Cols) -->
            <div class="lg:col-span-5 space-y-6">
                <div class="academic-card rounded-3xl p-6">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="font-bold text-lg flex items-center gap-2 text-slate-800">
                            <span>📝</span> Kaynak Metin
                        </h2>
                        <button id="clear-btn" class="text-sm text-slate-400 hover:text-red-500 font-medium transition-colors">Temizle</button>
                    </div>
                    
                    <textarea id="text-input" 
                        class="w-full h-80 p-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none text-sm leading-relaxed transition-all mb-4" 
                        placeholder="Analiz edilmesini istediğiniz akademik metni, özet kısmını veya makale taslağını buraya yapıştırın..."></textarea>

                    <div class="space-y-4">
                        <div class="flex gap-2">
                            <button id="analyze-btn" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg shadow-indigo-100 transition-all flex items-center justify-center gap-2 active:scale-95">
                                <span>🧠</span> Metni Analiz Et
                            </button>
                            <button id="speak-btn" class="bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 px-6 rounded-xl transition-all flex items-center justify-center gap-2 active:scale-95">
                                <span>🔊</span> Oku
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Settings Card -->
                <div class="academic-card rounded-3xl p-6">
                    <h3 class="font-bold text-slate-800 mb-4">Ayarlar</h3>
                    <div class="space-y-4">
                        <div>
                            <label class="text-xs font-bold text-slate-500 uppercase block mb-2">Seslendirme Karakteri</label>
                            <select id="voice-select" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none text-sm">
                                <option value="Kore">Kore (Dengeli - Akademik)</option>
                                <option value="Zephyr">Zephyr (Sıcak/Anlatıcı)</option>
                                <option value="Charon">Charon (Resmi/Ciddi)</option>
                                <option value="Leda">Leda (Yumuşak/Huzurlu)</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-xs font-bold text-slate-500 uppercase block mb-2">Okuma Tarzı Komutu</label>
                            <input type="text" id="style-input" placeholder="Örn: Profesyonel bir dille oku..." 
                                class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none text-sm">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Side: Results (7 Cols) -->
            <div class="lg:col-span-7 space-y-6">
                
                <!-- Results Loading Placeholder -->
                <div id="results-placeholder" class="hidden space-y-4">
                    <div class="academic-card rounded-3xl p-8 space-y-4">
                        <div class="h-6 w-1/3 loading-shimmer rounded"></div>
                        <div class="h-4 w-full loading-shimmer rounded"></div>
                        <div class="h-4 w-full loading-shimmer rounded"></div>
                        <div class="h-4 w-2/3 loading-shimmer rounded"></div>
                        <div class="pt-6 grid grid-cols-2 gap-4">
                            <div class="h-20 loading-shimmer rounded-xl"></div>
                            <div class="h-20 loading-shimmer rounded-xl"></div>
                        </div>
                    </div>
                </div>

                <!-- Analysis Results Content -->
                <div id="analysis-content" class="hidden animate-in fade-in slide-in-from-right-4 duration-500">
                    <div class="academic-card rounded-3xl p-8">
                        <div class="flex items-center justify-between mb-8 border-b border-slate-100 pb-4">
                            <h2 class="text-2xl font-bold text-slate-800">Analiz Raporu</h2>
                            <button id="speak-analysis-btn" class="text-indigo-600 hover:bg-indigo-50 p-2 px-4 rounded-xl text-sm font-bold flex items-center gap-2 transition-all">
                                <span>🔊</span> Raporu Dinle
                            </button>
                        </div>

                        <div id="analysis-results" class="prose prose-slate max-w-none space-y-6 text-slate-700 leading-relaxed">
                            <!-- AI Content will be injected here -->
                        </div>
                    </div>
                </div>

                <!-- TTS Feedback -->
                <div id="audio-status" class="hidden academic-card rounded-2xl p-4 border-l-4 border-indigo-600 animate-pulse">
                    <div class="flex items-center gap-4">
                        <div class="flex gap-1 h-4 items-end">
                            <div class="playing-bar" style="animation-delay: 0.1s"></div>
                            <div class="playing-bar" style="animation-delay: 0.3s"></div>
                            <div class="playing-bar" style="animation-delay: 0.2s"></div>
                        </div>
                        <p class="text-sm font-semibold text-indigo-900" id="audio-status-text">Seslendiriliyor...</p>
                        <audio id="audio-player" controls class="hidden"></audio>
                    </div>
                </div>

                <!-- Welcome/Idle State -->
                <div id="idle-state" class="flex flex-col items-center justify-center py-20 text-center space-y-4 opacity-40">
                    <div class="text-6xl">🔬</div>
                    <h3 class="text-xl font-bold text-slate-400">Analiz Başlatılmadı</h3>
                    <p class="max-w-xs mx-auto text-sm text-slate-400">Metninizi sol tarafa yapıştırın ve "Metni Analiz Et" butonuna basarak akademik raporunuzu oluşturun.</p>
                </div>

            </div>
        </div>
    </div>

    <script>
        // GÜVENLİK VE KULLANIM KOLAYLIĞI İÇİN GÜNCELLEME
        // API anahtarını kodun içine değil, tarayıcının hafızasına (localStorage) kaydediyoruz.
        let apiKey = localStorage.getItem('gemini_api_key');
        
        function checkAndGetApiKey() {
            if (!apiKey) {
                apiKey = prompt("Uygulamayı kullanmak için lütfen Google Gemini API Anahtarınızı girin:\n(Anahtarınız GitHub'a gitmez, sadece tarayıcınızda güvende kalır)");
                if (apiKey) {
                    localStorage.setItem('gemini_api_key', apiKey.trim());
                    updateApiStatus(true);
                } else {
                    updateApiStatus(false);
                    alert("API Anahtarı girmeden uygulama çalışamaz. Lütfen sayfayı yenileyip anahtarı girin.");
                    return false;
                }
            } else {
                updateApiStatus(true);
            }
            return true;
        }

        function resetApiKey() {
            localStorage.removeItem('gemini_api_key');
            apiKey = null;
            checkAndGetApiKey();
        }

        function updateApiStatus(isReady) {
            const dot = document.getElementById('api-status-dot');
            const text = document.getElementById('api-status-text');
            if(isReady) {
                dot.classList.replace('bg-red-500', 'bg-green-500');
                text.textContent = 'API Aktif (Değiştir)';
            } else {
                dot.classList.replace('bg-green-500', 'bg-red-500');
                text.textContent = 'API Bekleniyor';
            }
        }

        // Sayfa yüklendiğinde API anahtarını sor veya kontrol et
        window.addEventListener('load', checkAndGetApiKey);

        const textInput = document.getElementById('text-input');
        const analyzeBtn = document.getElementById('analyze-btn');
        const speakBtn = document.getElementById('speak-btn');
        const clearBtn = document.getElementById('clear-btn');
        const voiceSelect = document.getElementById('voice-select');
        const styleInput = document.getElementById('style-input');
        
        const resultsPlaceholder = document.getElementById('results-placeholder');
        const analysisContent = document.getElementById('analysis-content');
        const analysisResults = document.getElementById('analysis-results');
        const idleState = document.getElementById('idle-state');
        const audioStatus = document.getElementById('audio-status');
        const audioStatusText = document.getElementById('audio-status-text');
        const audioPlayer = document.getElementById('audio-player');
        const speakAnalysisBtn = document.getElementById('speak-analysis-btn');

        let lastAnalysisText = "";

        async function fetchWithRetry(url, options, retries = 5) {
            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (response.ok) return response;
                    if (response.status === 400 || response.status === 403) {
                        throw new Error("API Anahtarınız geçersiz veya kotalarınız dolmuş olabilir.");
                    }
                } catch (e) {
                    if (e.message.includes("API Anahtarınız")) throw e;
                }
                await new Promise(resolve => setTimeout(resolve, Math.pow(2, i) * 1000));
            }
            throw new Error("Sunucuya bağlanılamadı.");
        }

        async function analyzeText() {
            if (!checkAndGetApiKey()) return;

            const text = textInput.value.trim();
            if (!text) return;

            // UI Reset
            idleState.classList.add('hidden');
            analysisContent.classList.add('hidden');
            resultsPlaceholder.classList.remove('hidden');
            analyzeBtn.disabled = true;
            analyzeBtn.classList.add('opacity-50');

            const systemPrompt = `Sen akademik bir asistan ve makale hakemisin. Verilen metni Master/Doktora düzeyinde analiz et. Çıktını mutlaka şu başlıklar altında yapılandırılmış bir rapor olarak ver: 
            1. Özet (Kısa ve öz)
            2. Güçlü Yönler (Metot veya argüman bazında)
            3. Zayıf Yönler ve Eleştiriler
            4. Temel Bulgular/Katkılar
            5. Gelecek Çalışmalar İçin Öneriler (Research Gaps)
            Cevabı HTML formatında, <h3> ve <p> etiketleri kullanarak dön.`;

            try {
                const response = await fetchWithRetry(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: text }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] }
                    })
                });

                const data = await response.json();
                const resultText = data.candidates?.[0]?.content?.parts?.[0]?.text;
                
                if (resultText) {
                    lastAnalysisText = resultText.replace(/<[^>]*>/g, ''); // TTS için temiz metin
                    analysisResults.innerHTML = resultText;
                    resultsPlaceholder.classList.add('hidden');
                    analysisContent.classList.remove('hidden');
                }
            } catch (error) {
                alert("Hata: " + error.message);
            } finally {
                analyzeBtn.disabled = false;
                analyzeBtn.classList.remove('opacity-50');
            }
        }

        async function generateAudio(textToSpeak, label = "Metin seslendiriliyor...") {
            if (!checkAndGetApiKey()) return;
            if (!textToSpeak) return;

            const voice = voiceSelect.value;
            const style = styleInput.value.trim();
            const finalPrompt = style ? `${style}: ${textToSpeak}` : textToSpeak;

            audioStatus.classList.remove('hidden');
            audioStatusText.textContent = label;

            try {
                const response = await fetchWithRetry(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: finalPrompt }] }],
                        generationConfig: {
                            responseModalities: ["AUDIO"],
                            speechConfig: {
                                voiceConfig: { prebuiltVoiceConfig: { voiceName: voice } }
                            }
                        }
                    })
                });

                const result = await response.json();
                const audioBase64 = result.candidates?.[0]?.content?.parts?.[0]?.inlineData?.data;

                if (audioBase64) {
                    const wavBlob = pcmToWav(audioBase64, 24000);
                    const audioUrl = URL.createObjectURL(wavBlob);
                    audioPlayer.src = audioUrl;
                    audioPlayer.play();
                    audioPlayer.onended = () => audioStatus.classList.add('hidden');
                }
            } catch (error) {
                audioStatus.classList.add('hidden');
                alert("Seslendirme hatası: " + error.message);
            }
        }

        // PCM16 to WAV Helper
        function pcmToWav(base64Data, sampleRate) {
            const byteCharacters = atob(base64Data);
            const byteNumbers = new Array(byteCharacters.length);
            for (let i = 0; i < byteCharacters.length; i++) {
                byteNumbers[i] = byteCharacters.charCodeAt(i);
            }
            const buffer = new Uint8Array(byteNumbers).buffer;
            const dataView = new DataView(buffer);
            const wavBuffer = new ArrayBuffer(44 + buffer.byteLength);
            const view = new DataView(wavBuffer);

            const writeString = (v, o, s) => { for (let i=0; i<s.length; i++) v.setUint8(o+i, s.charCodeAt(i)); };
            writeString(view, 0, 'RIFF');
            view.setUint32(4, 36 + buffer.byteLength, true);
            writeString(view, 8, 'WAVE');
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeString(view, 36, 'data');
            view.setUint32(40, buffer.byteLength, true);
            for (let i = 0; i < buffer.byteLength; i++) view.setUint8(44 + i, dataView.getUint8(i));
            
            return new Blob([wavBuffer], { type: 'audio/wav' });
        }

        analyzeBtn.addEventListener('click', analyzeText);
        speakBtn.addEventListener('click', () => generateAudio(textInput.value.trim()));
        speakAnalysisBtn.addEventListener('click', () => generateAudio(lastAnalysisText, "Analiz raporu seslendiriliyor..."));
        clearBtn.addEventListener('click', () => {
            textInput.value = "";
            analysisContent.classList.add('hidden');
            idleState.classList.remove('hidden');
            audioStatus.classList.add('hidden');
        });
    </script>
</body>
</html>
